# cargo-about configuration for THIRD_PARTY_NOTICES.
# Used by install/scripts/generate-third-party-notices.sh; see install/AGENTS.md.
#
# Licenses of crates linked into the shipped binaries (tui, rakumux-ptyd,
# rakumux-api, rakumux-mcp).
# Adding a license here is a legal decision: anything copyleft beyond MPL-2.0's
# file-level terms (GPL, LGPL, AGPL, ...) must not be accepted for a closed-source
# release. MPL-2.0 (webpki-roots, via reqwest/rustls) is used unmodified; the notices
# point to its source as MPL-2.0 requires.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Only what ships in the binaries: no dev or build-only dependencies.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Rakumux's own crates are proprietary (publish = false); they aren't third-party.
private = { ignore = true }

# Release targets (install/scripts/build-release.sh), so platform-specific crates count.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
