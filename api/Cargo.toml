[package]
name = "rakumux-api"
version = "0.1.0"
edition = "2021"
description = "Rakumux external API: HTTP/1.1 + JSON (and WebSocket streams) over the session daemon"
publish = false
workspace = "../tui"

[lib]
name = "rakumux_api"
path = "src/lib.rs"

[[bin]]
name = "rakumux-api"
path = "src/main.rs"

[dependencies]
rakumux-session-core = { path = "../tui/crates/session-core" }
clap = { version = "=4.5.46", features = ["derive"] }
form_urlencoded = "=1.2.2"
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
hyper = { version = "=0.14.32", features = ["server", "http1", "tcp", "runtime"] }
libc = "=0.2.175"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
base64 = "=0.21.7"
tempfile = "=3.21.0"
