name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: cargo fmt --all --check
        working-directory: tui
      - run: cargo build --workspace --locked
        working-directory: tui
      - run: cargo test --workspace --locked --no-fail-fast
        working-directory: tui
        env:
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-home
      - name: Check and test the Linux static updater
        if: runner.os == 'Linux'
        working-directory: tui
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-musl-home
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo build --workspace --locked --target x86_64-unknown-linux-musl
          cargo test -p tui updater::binary --locked --target x86_64-unknown-linux-musl
      - run: node --test 'integrations/open-code/activity.test.mjs'
      - run: bash tests/test-repository.sh
      - run: bash tests/test-command-hook.sh
      - run: bash tests/test-release.sh
      - run: bash tests/test-release-tag.sh

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
