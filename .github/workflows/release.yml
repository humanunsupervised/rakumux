name: Binary release

# A pushed v* tag builds the release and leaves it a draft, unsigned. Then
# either the `sign` job signs and publishes it, once the `release`
# environment's reviewer approves (its key is that environment's secret; only
# when the repository variable RAKUMUX_CI_SIGNING is `true` and the newest
# published release already trusts that key), and the same run goes on to npm;
# or the maintainer signs it with the offline key, uploads
# checksums.txt.minisig and publishes it, and that `published` event runs the
# npm job. npm checks the signature first either way. See "Signed releases" in
# install/AGENTS.md. npm's trusted publisher names this file, so npm stays in it.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
      mode: ${{ steps.targets.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and selected targets
        id: targets
        shell: bash
        run: |
          ./release-scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      # A build without release keys refuses every update it is offered.
      - name: Check the release signing keys
        run: ./release-scripts/release-keys.sh check
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Install Linux static-linking tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test source
        working-directory: tui
        env:
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-test-home
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked --no-fail-fast
      - name: Test release entry and tag metadata handling
        shell: bash
        run: |
          bash tests/test-release.sh
          bash tests/test-release-tag.sh
      - name: Install license-notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Build release package
        env:
          RAKUMUX_LINUX_TARGET: x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./release-scripts/build-release.sh "${GITHUB_REF_NAME#v}" --no-clean --platform=${{ matrix.platform }}
      - name: Verify package and isolated install
        env:
          SKIP_BUILD: '1'
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-install-home
        run: ./release-scripts/test-install.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            release/rakumux-${{ matrix.platform }}.tar.gz
            release/checksums.txt
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-artifacts
      - name: Verify complete release asset set
        env:
          RELEASE_TARGETS: ${{ needs.prepare.outputs.targets }}
        shell: bash
        run: |
          mkdir release-upload
          IFS=',' read -r -a platforms <<< "$RELEASE_TARGETS"
          for platform in "${platforms[@]}"; do
            directory="release-artifacts/binary-$platform"
            (cd "$directory" && sha256sum -c checksums.txt)
            cp "$directory/rakumux-$platform.tar.gz" release-upload/
            cat "$directory/checksums.txt" >> release-upload/checksums.txt
          done
          (cd release-upload && sha256sum -c checksums.txt)
      # Never published from here: only a signed release is.
      - name: Upload the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          mode="$RELEASE_MODE"
          case "$mode" in stable|draft|prerelease) ;; *) echo 'Missing release-mode annotation' >&2; exit 1 ;; esac
          notes="install/release-notes/${tag#v}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$tag" --verify-tag --draft --title "Rakumux $tag" --notes-file "$notes" release-upload/*
          else
            gh release create "$tag" --verify-tag --draft --title "Rakumux $tag" --generate-notes release-upload/*
          fi
          echo "::notice::$tag is a draft ($mode). It is published once signed."

  # Whether this run may sign the draft: CI signing is on, and the key named
  # `ci` in install/release-keys.pub is listed the same in the newest
  # published release's, so every copy that updated to that release accepts
  # the signature (a release that adds or changes the key is signed offline).
  signable:
    needs: [prepare, publish]
    if: github.event_name == 'push' && vars.RAKUMUX_CI_SIGNING == 'true'
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      trusted_by: ${{ steps.check.outputs.trusted_by }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the newest published release trusts the CI key
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current="$(./release-scripts/release-keys.sh named ci)"
          newest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
            --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          trusted=""
          if [[ -n "$current" && -n "$newest" ]]; then
            git show "$newest:install/release-keys.pub" > "$RUNNER_TEMP/trusted-keys.pub" 2>/dev/null || true
            trusted="$(RAKUMUX_RELEASE_KEYS="$RUNNER_TEMP/trusted-keys.pub" ./release-scripts/release-keys.sh named ci 2>/dev/null || true)"
          fi
          if [[ -n "$current" && "$trusted" == "$current" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "trusted_by=$newest" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME stays a draft: ${newest:-no published release} doesn't list this commit's ci key, so sign it with the offline key."
          fi

  # Signs and publishes the draft once the `release` environment's reviewer
  # approves this job (GitHub asks them; one tap in GitHub Mobile). The key is
  # that environment's secret, only ever in this job.
  sign:
    needs: [prepare, publish, signable]
    if: github.event_name == 'push' && needs.signable.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      published: ${{ steps.sign.outputs.published }}
      mode: ${{ steps.sign.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install --yes minisign && minisign -v
      - name: Sign and publish the draft
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          RAKUMUX_SIGNING_KEY: ${{ secrets.RAKUMUX_RELEASE_SIGNING_KEY }}
          TRUSTED_BY: ${{ needs.signable.outputs.trusted_by }}
        shell: bash
        run: |
          git show "$TRUSTED_BY:install/release-keys.pub" > "$RUNNER_TEMP/trusted-keys.pub"
          ./release-scripts/sign-draft.sh "$GITHUB_REF_NAME" --trusted-by "$RUNNER_TEMP/trusted-keys.pub"

  # The published, signed GitHub release's packages, as install.sh downloads
  # them, go to npm as `rakumux`. Trusted publishing (OIDC): no npm secret;
  # npmjs.com trusts this repository's release.yml. Runs when the signed
  # release is published; publish-npm.sh checks its signature against
  # install/release-keys.pub first. If it fails, re-run this job; a version
  # on npm is skipped. Runs when a release signed offline is published, or in
  # the tag's run once `sign` published it (a release the workflow's own token
  # publishes starts no `release` event, so npm never runs twice).
  npm:
    needs: [sign]
    if: >-
      always() && (github.event_name == 'release' ||
      (github.event_name == 'push' && needs.sign.outputs.published == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that npm takes this release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease || needs.sign.outputs.mode == 'prerelease' }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish=true
          dist_tag=latest
          if [[ "$PRERELEASE" == true ]]; then dist_tag=next; fi
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for platform in macos-intel macos-arm64 linux-x64; do
            if [[ "$publish" == true ]] && ! grep -qx "rakumux-$platform.tar.gz" <<<"$assets"; then
              echo "::warning::v$version has no $platform package and npm needs all three platforms, so npm doesn't get this release"
              publish=false
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: |
          npm install --global npm@11.21.1
          npm --version
      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        shell: bash
        run: ./release-scripts/publish-npm.sh "${GITHUB_REF_NAME#v}" --from-release "--tag=$NPM_DIST_TAG"
