name: Binary release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
      mode: ${{ steps.targets.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and selected targets
        id: targets
        shell: bash
        run: |
          ./install/scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Install Linux static-linking tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test source
        working-directory: tui
        env:
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-test-home
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked --no-fail-fast
      - name: Test release entry and tag metadata handling
        shell: bash
        run: |
          bash tests/test-release.sh
          bash tests/test-release-tag.sh
      - name: Install license-notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Build release package
        env:
          RAKUMUX_LINUX_TARGET: x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./install/scripts/build-release.sh "${GITHUB_REF_NAME#v}" --no-clean --platform=${{ matrix.platform }}
      - name: Verify package and isolated install
        env:
          SKIP_BUILD: '1'
          RAKUMUX_HOME: ${{ runner.temp }}/rakumux-install-home
        run: ./install/scripts/test-install.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            release/rakumux-${{ matrix.platform }}.tar.gz
            release/checksums.txt
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-artifacts
      - name: Verify complete release asset set
        env:
          RELEASE_TARGETS: ${{ needs.prepare.outputs.targets }}
        shell: bash
        run: |
          mkdir release-upload
          IFS=',' read -r -a platforms <<< "$RELEASE_TARGETS"
          for platform in "${platforms[@]}"; do
            directory="release-artifacts/binary-$platform"
            (cd "$directory" && sha256sum -c checksums.txt)
            cp "$directory/rakumux-$platform.tar.gz" release-upload/
            cat "$directory/checksums.txt" >> release-upload/checksums.txt
          done
          (cd release-upload && sha256sum -c checksums.txt)
      - name: Publish binary-only release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          mode="$RELEASE_MODE"
          case "$mode" in stable|draft|prerelease) ;; *) echo 'Missing release-mode annotation' >&2; exit 1 ;; esac
          notes="install/release-notes/${tag#v}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$tag" --verify-tag --draft --title "Rakumux $tag" --notes-file "$notes" release-upload/*
          else
            gh release create "$tag" --verify-tag --draft --title "Rakumux $tag" --generate-notes release-upload/*
          fi
          case "$mode" in
            stable) gh release edit "$tag" --draft=false --latest ;;
            prerelease) gh release edit "$tag" --draft=false --prerelease --latest=false ;;
            draft) echo 'All binary assets uploaded; release remains a draft.' ;;
          esac

  # The published GitHub release's packages, as install.sh downloads them, go
  # to npm as `rakumux`. Trusted publishing (OIDC): no npm secret; npmjs.com
  # trusts this repository's release.yml. The GitHub release is already out
  # when this runs: if it fails, re-run this job; a version on npm is skipped.
  npm:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that npm takes this release
        id: release
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TARGETS: ${{ needs.prepare.outputs.targets }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish=true
          dist_tag=""
          case "$RELEASE_MODE" in
            stable) dist_tag=latest ;;
            prerelease) dist_tag=next ;;
            draft)
              echo "::notice::v$version stays a draft, so npm doesn't get it. Once it's published on GitHub: ./install/scripts/publish-npm.sh $version --from-release"
              publish=false
              ;;
            *) echo '::error::Missing release-mode annotation'; exit 1 ;;
          esac
          for platform in macos-intel macos-arm64 linux-x64; do
            if [[ "$publish" == true && ",$RELEASE_TARGETS," != *",$platform,"* ]]; then
              echo "::warning::v$version has no $platform package and npm needs all three platforms, so npm doesn't get this release"
              publish=false
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.release.outputs.publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: |
          npm install --global npm@11.21.1
          npm --version
      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        shell: bash
        run: ./install/scripts/publish-npm.sh "${GITHUB_REF_NAME#v}" --from-release "--tag=$NPM_DIST_TAG"
