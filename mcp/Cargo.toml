[package]
name = "orchestra-mcp"
version = "0.1.0"
edition = "2021"
description = "Orchestra MCP server (stdio) for coding agents; drives the Orchestra external API"
publish = false
workspace = "../tui"

[lib]
name = "orchestra_mcp"
path = "src/lib.rs"

[[bin]]
name = "orchestra-mcp"
path = "src/main.rs"

[dependencies]
orchestra-api = { path = "../api" }
orchestra-session-core = { path = "../tui/crates/session-core" }
reqwest = { version = "=0.11.27", default-features = false, features = ["json"] }
# Official MCP Rust SDK; all use is confined to src/server.rs.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync", "time"] }

[dev-dependencies]
form_urlencoded = "=1.2.2"
libc = "=0.2.175"
tempfile = "=3.21.0"
