[package]
name = "orchestra-session-core"
version = "0.1.0"
edition = "2021"
description = "Orchestra session model, wire protocol and client"
publish = false

[lib]
name = "session_core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
getrandom = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
