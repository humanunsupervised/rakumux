[package]
name = "rakumux-ptyd"
version = "0.1.0"
edition = "2021"
description = "Rakumux session daemon: owns terminals and the session registry"
publish = false

[lib]
name = "ptyd"
path = "src/lib.rs"

[[bin]]
name = "rakumux-ptyd"
path = "src/main.rs"

[dependencies]
rakumux-session-core = { path = "../session-core" }
rakumux-vt = { path = "../vt" }
portable-pty = "0.9.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
