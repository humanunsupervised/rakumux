[package]
name = "tui"
version = "0.1.0"
edition = "2021"
description = "Rakumux: terminal sessions for coding agents (TUI and CLI)"
authors = ["Rakumux contributors"]
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true

[workspace]
members = [".", "crates/vt", "crates/session-core", "crates/ptyd", "crates/sensagent", "../api", "../mcp"]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/humanunsupervised/rakumux"
homepage = "https://rakumux.com"

[dependencies]
ratatui = "0.25"
crossterm = { version = "0.27", features = ["event-stream"] }
futures-util = "0.3"
rakumux-session-core = { path = "crates/session-core" }
rakumux-sensagent = { path = "crates/sensagent" }
rakumux-vt = { path = "crates/vt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
atty = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
chrono = { version = "0.4" }
base64 = "0.21"
libc = "0.2"
qrcodegen = "1.8"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
semver = "1.0"
tempfile = "3.8"

[[bin]]
name = "tui"
path = "src/main.rs"
